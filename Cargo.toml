[package]
name = "scarif-database-mcp"
version = "0.6.1"
edition = "2024"
license = "Apache-2.0"

[dependencies]
aes = "0.9.4"
base64 = "0.23.1"
bytes = "1.12.2"
cbc = "0.2.1"
chacha20poly1305 = "0.11.0"
directories = "6.0.0"
fake = "5.1.0"
fallible-iterator = "0.3.0"
fast-socks5 = "0.10.0"
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
mongodb = { version = "3.10.2", features = ["socks5-proxy"] }
postgres-protocol = "0.6.12"
postgres-types = "0.2.14"
rand = "0.10.4"
rand_chacha = "0.10.0"
regex = "1.13.2"
rmcp = { version = "3.11.0", features = ["server", "macros", "transport-io"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
russh = { version = "0.65", default-features = false, features = ["ring", "rsa"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1 = "0.11"
sha2 = "0.11.1"
sqlparser = { version = "0.64.0", features = ["visitor"] }
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "net", "time", "sync"] }
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1"] }
tokio-postgres-rustls = { version = "0.14.0", default-features = false, features = ["ring"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
unicode-normalization = "0.1.26"
webpki-roots = "1.0.12"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
hickory-resolver = "0.26.3"
md-5 = "0.11.0"
cucumber = "0.23.0"
tokio = { version = "1.54.1", features = ["test-util"] }

[[test]]
name = "bdd"
harness = false
