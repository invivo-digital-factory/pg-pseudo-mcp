services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pgpseudo
    ports:
      - "55432:5432"
    volumes:
      - ./tests/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pgpseudo"]
      interval: 2s
      timeout: 3s
      retries: 30
  ssh:
    build: tests/ssh
    ports:
      - "55222:22"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 22"]
      interval: 2s
      timeout: 3s
      retries: 30
