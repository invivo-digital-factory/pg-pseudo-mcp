services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pgpseudo
    ports:
      - "55432:5432"
    volumes:
      - ./tests/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pgpseudo"]
      interval: 2s
      timeout: 3s
      retries: 30
