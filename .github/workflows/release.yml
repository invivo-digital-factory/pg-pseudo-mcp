name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the crate version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          crate_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$TAG" != "v$crate_version" ]; then
            echo "::error::tag $TAG does not match Cargo.toml version $crate_version"
            exit 1
          fi

  build:
    needs: version
    strategy:
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-14, native: true }
          - { target: x86_64-apple-darwin, os: macos-14, native: false }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, native: true }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm, native: true }
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target "$TARGET"
      - name: Smoke test the binary
        if: matrix.native
        run: |
          output=$("target/$TARGET/release/pg-pseudo-mcp" --version)
          [ "$output" = "pg-pseudo-mcp ${TAG#v}" ] || { echo "::error::unexpected --version output: $output"; exit 1; }
      - name: Check the binary architecture
        if: ${{ !matrix.native }}
        run: |
          archs=$(lipo -archs "target/$TARGET/release/pg-pseudo-mcp")
          [ "$archs" = "x86_64" ] || { echo "::error::unexpected architecture: $archs"; exit 1; }
      - name: Package
        run: |
          name="pg-pseudo-mcp-$TARGET"
          mkdir "$name"
          cp "target/$TARGET/release/pg-pseudo-mcp" LICENSE README.md data/NOTICE "$name/"
          tar -czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: pg-pseudo-mcp-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write the checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
