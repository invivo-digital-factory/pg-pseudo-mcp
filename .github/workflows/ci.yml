name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pgpseudo
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pgpseudo"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      PG_PSEUDO_TEST_DATABASE_URL: postgres://pgpseudo:pgpseudo@localhost:55432/pgpseudo
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Seed database
        run: PGPASSWORD=postgres psql -h localhost -p 55432 -U postgres -d pgpseudo -v ON_ERROR_STOP=1 -f tests/sql/seed.sql
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo test -- --include-ignored
      - run: cargo build --release
